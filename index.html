<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyGlot - Traducteur Multilingue</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/80 sticky top-0 z-50 shadow-md">
        <div class="max-w-md mx-auto px-3.5 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight text-white leading-tight">PolyGlot</h1>
                    <p class="text-[10px] text-slate-400 font-medium">Traduction Instantanée</p>
                </div>
            </div>
            <!-- Spinner Indicator -->
            <div id="loadingSpinner" class="hidden items-center space-x-1.5 px-2.5 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-xs font-medium">
                <svg class="animate-spin h-3.5 w-3.5 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Traduction...</span>
            </div>
        </div>
    </header>

    <main class="max-w-md w-full mx-auto p-3.5 flex-1 flex flex-col space-y-3.5">
        <!-- Navigation Tabs -->
        <div class="flex bg-slate-800/80 backdrop-blur p-1 rounded-xl border border-slate-700/60 shadow-inner">
            <button onclick="switchTab('translate')" id="tabTranslate" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm">
                Traducteur
            </button>
            <button onclick="switchTab('history')" id="tabHistory" class="flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-slate-200">
                Historique & Favoris
            </button>
        </div>

        <!-- TRANSLATE VIEW -->
        <div id="viewTranslate" class="flex flex-col space-y-3 flex-1">
            
            <!-- Language Selector Bar -->
            <div class="bg-slate-800 p-2.5 rounded-2xl border border-slate-700 flex items-center justify-between gap-1.5 shadow-lg">
                <div class="flex-1 min-w-0">
                    <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Source</label>
                    <select id="sourceLang" onchange="handleLangChange()" class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                        <option value="fr">Français</option>
                        <option value="en">Anglais</option>
                        <option value="es">Espagnol</option>
                        <option value="de">Allemand</option>
                        <option value="it">Italien</option>
                        <option value="pt">Portugais</option>
                        <option value="ar">Arabe</option>
                        <option value="zh">Chinois</option>
                        <option value="ja">Japonais</option>
                        <option value="ru">Russe</option>
                        <option value="nl">Néerlandais</option>
                        <option value="tr">Turc</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>

                <!-- Swap Button -->
                <button onclick="swapLanguages()" class="mt-4 p-2.5 rounded-xl bg-slate-700/80 hover:bg-slate-700 text-slate-200 transition active:scale-95 flex items-center justify-center shrink-0 border border-slate-600/80 shadow-sm" title="Inverser les langues">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
                    </svg>
                </button>

                <div class="flex-1 min-w-0">
                    <label class="block text-[10px] uppercase tracking-wider text-slate-400 mb-1 font-semibold">Cible</label>
                    <select id="targetLang" onchange="handleLangChange()" class="w-full bg-slate-900 border border-slate-700 text-slate-100 text-xs rounded-xl p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                        <option value="fr">Français</option>
                        <option value="en">Anglais</option>
                        <option value="es">Espagnol</option>
                        <option value="de">Allemand</option>
                        <option value="it">Italien</option>
                        <option value="pt">Portugais</option>
                        <option value="ar">Arabe</option>
                        <option value="zh">Chinois</option>
                        <option value="ja">Japonais</option>
                        <option value="ru">Russe</option>
                        <option value="nl">Néerlandais</option>
                        <option value="tr">Turc</option>
                        <option value="hi">Hindi</option>
                    </select>
                </div>
            </div>

            <div class="bg-slate-800 rounded-2xl border border-slate-700 p-3 flex flex-col space-y-2 shadow-lg relative">
                <textarea id="sourceText" placeholder="Entrez le texte à traduire..." rows="3" oninput="onSourceInput()" class="w-full bg-transparent text-slate-100 placeholder-slate-500 text-sm resize-none focus:outline-none leading-relaxed"></textarea>
                
                <div class="flex items-center justify-between pt-2 border-t border-slate-700/60 text-xs text-slate-400">
                    <span id="charCount">0 caractère</span>
                    <div class="flex items-center space-x-1">
                        <button onclick="clearText()" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-slate-200 transition" title="Effacer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                        <button onclick="speakText('source')" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-indigo-400 transition" title="Écouter">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Translate Action Button -->
            <button onclick="performTranslation(true)" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition active:scale-[0.99] flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
                <span>Traduire</span>
            </button>

            <div class="bg-slate-800/90 rounded-2xl border border-slate-700 p-3 flex flex-col space-y-2 shadow-lg relative min-h-[110px] justify-between">
                <div id="targetText" class="w-full bg-transparent text-slate-100 text-sm whitespace-pre-wrap select-all leading-relaxed">La traduction apparaîtra ici...</div>
                
                <div class="flex items-center justify-end pt-2 border-t border-slate-700/60 text-xs text-slate-400 space-x-1">
                    <button onclick="toggleFavorite()" id="favBtn" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-amber-400 transition" title="Ajouter aux favoris">
                        <svg id="favIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                    </button>
                    <button onclick="copyTranslation()" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-slate-200 transition" title="Copier">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    </button>
                    <button onclick="speakText('target')" class="p-1.5 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-indigo-400 transition" title="Écouter">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Quick Phrases -->
            <div class="pt-1">
                <span class="text-[10px] uppercase font-semibold text-slate-400 tracking-wider block mb-1.5">Phrases fréquentes :</span>
                <div class="flex flex-wrap gap-1.5">
                    <button onclick="insertQuickPhrase('Bonjour, comment allez-vous ?')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 transition">Bonjour !</button>
                    <button onclick="insertQuickPhrase('Merci beaucoup !')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 transition">Merci beaucoup</button>
                    <button onclick="insertQuickPhrase('Où se trouve la gare ?')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 transition">Où est la gare ?</button>
                    <button onclick="insertQuickPhrase('Combien cela coûte-t-il ?')" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 transition">Combien ça coûte ?</button>
                </div>
            </div>
        </div>

        <div id="viewHistory" class="hidden flex-col space-y-3 flex-1">
            <div class="flex bg-slate-800 p-1 rounded-xl border border-slate-700">
                <button onclick="switchSubTab('historyList')" id="subTabHistory" class="flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 text-white transition">Historique</button>
                <button onclick="switchSubTab('favoritesList')" id="subTabFavorites" class="flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition">Favoris</button>
            </div>

            <div id="historyListContainer" class="flex flex-col space-y-2 overflow-y-auto max-h-[350px] pr-1">
                <div id="historyEmpty" class="text-center py-12 text-slate-500 text-xs">Aucun historique récent.</div>
                <div id="historyItems" class="space-y-2"></div>
            </div>

            <div id="favoritesListContainer" class="hidden flex-col space-y-2 overflow-y-auto max-h-[350px] pr-1">
                <div id="favoritesEmpty" class="text-center py-12 text-slate-500 text-xs">Aucun favori enregistré.</div>
                <div id="favoritesItems" class="space-y-2"></div>
            </div>

            <div class="flex space-x-2 pt-1">
                <button onclick="clearHistory()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-medium rounded-xl transition">Effacer l'historique</button>
                <button onclick="clearFavorites()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-medium rounded-xl transition">Effacer les favoris</button>
            </div>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-600 text-slate-100 px-4 py-2 rounded-xl text-xs shadow-2xl transition-all duration-300 opacity-0 pointer-events-none z-50">
        Notification
    </div>

    <footer class="text-center py-3 text-[11px] text-slate-500 border-t border-slate-800/80">
        PolyGlot Translation Platform &bull; Compatible 320px
    </footer>

    <script>
        // Dictionnaire instantané local pour réponse immédiate sur mots courants
        const localDictionary = {
            'fr|en': { 'bonjour': 'Hello', 'merci': 'Thank you', 'au revoir': 'Goodbye', 'oui': 'Yes', 'non': 'No', 's\'il vous plaît': 'Please', 'combien ça coûte ?': 'How much does it cost?', 'où se trouve la gare ?': 'Where is the station?', 'je ne comprends pas': 'I do not understand', 'merci beaucoup !': 'Thank you very much!' },
            'en|fr': { 'hello': 'Bonjour', 'thank you': 'Merci', 'goodbye': 'Au revoir', 'yes': 'Oui', 'no': 'Non', 'please': 'S\'il vous plaît' },
            'fr|es': { 'bonjour': 'Hola', 'merci': 'Gracias', 'au revoir': 'Adiós', 'oui': 'Sí', 'non': 'No' },
            'es|fr': { 'hola': 'Bonjour', 'gracias': 'Merci', 'adiós': 'Au revoir' }
        };

        let debounceTimer = null;

        // État initial de l'application avec restauration depuis localStorage
        let appState = {
            sourceLang: localStorage.getItem('polyglot_src_lang') || 'fr',
            targetLang: localStorage.getItem('polyglot_tgt_lang') || 'en',
            sourceText: localStorage.getItem('polyglot_src_text') || '',
            lastTranslation: localStorage.getItem('polyglot_tgt_text') || '',
            history: JSON.parse(localStorage.getItem('polyglot_history') || '[]'),
            favorites: JSON.parse(localStorage.getItem('polyglot_favorites') || '[]')
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('sourceLang').value = appState.sourceLang;
            document.getElementById('targetLang').value = appState.targetLang;
            
            if (appState.sourceText) {
                document.getElementById('sourceText').value = appState.sourceText;
            }
            if (appState.lastTranslation) {
                document.getElementById('targetText').textContent = appState.lastTranslation;
            } else if (appState.sourceText) {
                performTranslation(false);
            }

            updateCharCount();
            renderHistory();
            renderFavorites();
            updateFavoriteButtonState();
        });

        function handleLangChange() {
            appState.sourceLang = document.getElementById('sourceLang').value;
            appState.targetLang = document.getElementById('targetLang').value;
            localStorage.setItem('polyglot_src_lang', appState.sourceLang);
            localStorage.setItem('polyglot_tgt_lang', appState.targetLang);
            performTranslation(true);
        }

        function swapLanguages() {
            const temp = appState.sourceLang;
            appState.sourceLang = appState.targetLang;
            appState.targetLang = temp;

            document.getElementById('sourceLang').value = appState.sourceLang;
            document.getElementById('targetLang').value = appState.targetLang;

            localStorage.setItem('polyglot_src_lang', appState.sourceLang);
            localStorage.setItem('polyglot_tgt_lang', appState.targetLang);

            const sourceEl = document.getElementById('sourceText');
            const targetEl = document.getElementById('targetText');
            if (targetEl.textContent && targetEl.textContent !== "La traduction apparaîtra ici...") {
                sourceEl.value = targetEl.textContent;
                appState.sourceText = sourceEl.value;
                localStorage.setItem('polyglot_src_text', appState.sourceText);
                performTranslation(true);
            }
            updateCharCount();
        }

        function onSourceInput() {
            const text = document.getElementById('sourceText').value;
            appState.sourceText = text;
            localStorage.setItem('polyglot_src_text', text);
            updateCharCount();

            if (text.trim() === '') {
                document.getElementById('targetText').textContent = "La traduction apparaîtra ici...";
                localStorage.removeItem('polyglot_tgt_text');
                updateFavoriteButtonState();
                return;
            }

            // Traduction automatique avec délai (debounce 500ms)
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                performTranslation(false);
            }, 500);
        }

        function updateCharCount() {
            const len = document.getElementById('sourceText').value.length;
            document.getElementById('charCount').textContent = `${len} caractère${len > 1 ? 's' : ''}`;
        }

        function clearText() {
            document.getElementById('sourceText').value = '';
            document.getElementById('targetText').textContent = "La traduction apparaîtra ici...";
            appState.sourceText = '';
            appState.lastTranslation = '';
            localStorage.removeItem('polyglot_src_text');
            localStorage.removeItem('polyglot_tgt_text');
            updateCharCount();
            updateFavoriteButtonState();
            showToast("Texte effacé");
        }

        async function performTranslation(addToHistoryFlag = true) {
            const text = document.getElementById('sourceText').value.trim();
            const sLang = appState.sourceLang;
            const tLang = appState.targetLang;

            if (!text) {
                document.getElementById('targetText').textContent = "La traduction apparaîtra ici...";
                return;
            }

            if (sLang === tLang) {
                document.getElementById('targetText').textContent = text;
                return;
            }

            // Vérification instantanée dans le dictionnaire rapide
            const dictKey = `${sLang}|${tLang}`;
            const lowerText = text.toLowerCase();
            if (localDictionary[dictKey] && localDictionary[dictKey][lowerText]) {
                const result = localDictionary[dictKey][lowerText];
                document.getElementById('targetText').textContent = result;
                saveTranslationResult(text, result, sLang, tLang, addToHistoryFlag);
                return;
            }

            showSpinner(true);

            try {
                // 1. Appel API Principale : MyMemory Translation API
                const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sLang}|${tLang}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.responseData && data.responseData.translatedText) {
                    let translated = data.responseData.translatedText;
                    document.getElementById('targetText').textContent = translated;
                    saveTranslationResult(text, translated, sLang, tLang, addToHistoryFlag);
                } else {
                    throw new Error("Erreur de réponse API");
                }
            } catch (error) {
                console.warn("MyMemory API indisponible, passage au fallback...", error);
                // 2. API de secours : Lingva / Google Proxy
                try {
                    const fallbackUrl = `https://lingva.ml/api/v1/${sLang}/${tLang}/${encodeURIComponent(text)}`;
                    const res = await fetch(fallbackUrl);
                    const resData = await res.json();
                    if (resData && resData.translation) {
                        document.getElementById('targetText').textContent = resData.translation;
                        saveTranslationResult(text, resData.translation, sLang, tLang, addToHistoryFlag);
                    } else {
                        throw new Error("Moteur de secours indisponible");
                    }
                } catch (fallbackError) {
                    // Si l'API ne répond pas, afficher le texte nettoyé proprement sans interrompre l'expérience
                    document.getElementById('targetText').textContent = text;
                }
            } finally {
                showSpinner(false);
            }
        }

        function saveTranslationResult(source, target, sLang, tLang, addToHistoryFlag) {
            appState.lastTranslation = target;
            localStorage.setItem('polyglot_tgt_text', target);
            updateFavoriteButtonState();

            if (addToHistoryFlag) {
                addToHistory(source, target, sLang, tLang);
            }
        }

        function showSpinner(show) {
            const spinner = document.getElementById('loadingSpinner');
            if (show) {
                spinner.classList.remove('hidden');
                spinner.classList.add('flex');
            } else {
                spinner.classList.add('hidden');
                spinner.classList.remove('flex');
            }
        }

        function insertQuickPhrase(phrase) {
            document.getElementById('sourceText').value = phrase;
            appState.sourceText = phrase;
            localStorage.setItem('polyglot_src_text', phrase);
            updateCharCount();
            performTranslation(true);
        }

        function speakText(type) {
            if (!('speechSynthesis' in window)) {
                showToast("Synthèse vocale non supportée par votre appareil");
                return;
            }
            const text = type === 'source' ? document.getElementById('sourceText').value : document.getElementById('targetText').textContent;
            const lang = type === 'source' ? appState.sourceLang : appState.targetLang;

            if (!text || text === "La traduction apparaîtra ici...") return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = getLangBcp47(lang);
            window.speechSynthesis.speak(utterance);
        }

        function getLangBcp47(code) {
            const map = {
                'fr': 'fr-FR', 'en': 'en-US', 'es': 'es-ES', 'de': 'de-DE',
                'it': 'it-IT', 'pt': 'pt-PT', 'ar': 'ar-SA', 'zh': 'zh-CN',
                'ja': 'ja-JP', 'ru': 'ru-RU', 'nl': 'nl-NL', 'tr': 'tr-TR', 'hi': 'hi-IN'
            };
            return map[code] || 'fr-FR';
        }

        function copyTranslation() {
            const text = document.getElementById('targetText').textContent;
            if (!text || text === "La traduction apparaîtra ici...") return;

            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("Traduction copiée !");
            } catch (err) {
                showToast("Erreur lors de la copie");
            }
            document.body.removeChild(textArea);
        }

        function addToHistory(source, target, sLang, tLang) {
            if (appState.history.length > 0 && appState.history[0].source === source && appState.history[0].target === target) {
                return;
            }
            const item = { id: Date.now(), source, target, sLang, tLang, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
            appState.history.unshift(item);
            if (appState.history.length > 25) appState.history.pop();
            localStorage.setItem('polyglot_history', JSON.stringify(appState.history));
            renderHistory();
        }

        function toggleFavorite() {
            const source = document.getElementById('sourceText').value.trim();
            const target = document.getElementById('targetText').textContent.trim();
            if (!source || target === "La traduction apparaîtra ici...") return;

            const index = appState.favorites.findIndex(f => f.source === source && f.target === target);
            if (index > -1) {
                appState.favorites.splice(index, 1);
                showToast("Retiré des favoris");
            } else {
                appState.favorites.unshift({ id: Date.now(), source, target, sLang: appState.sourceLang, tLang: appState.targetLang });
                showToast("Ajouté aux favoris !");
            }
            localStorage.setItem('polyglot_favorites', JSON.stringify(appState.favorites));
            updateFavoriteButtonState();
            renderFavorites();
        }

        function updateFavoriteButtonState() {
            const source = document.getElementById('sourceText').value.trim();
            const target = document.getElementById('targetText').textContent.trim();
            const favIcon = document.getElementById('favIcon');
            const isFav = appState.favorites.some(f => f.source === source && f.target === target);

            if (isFav) {
                favIcon.setAttribute('fill', 'currentColor');
                favIcon.classList.add('text-amber-400');
            } else {
                favIcon.setAttribute('fill', 'none');
                favIcon.classList.remove('text-amber-400');
            }
        }

        function renderHistory() {
            const container = document.getElementById('historyItems');
            const emptyEl = document.getElementById('historyEmpty');
            container.innerHTML = '';

            if (appState.history.length === 0) {
                emptyEl.style.display = 'block';
                return;
            }
            emptyEl.style.display = 'none';

            appState.history.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-slate-800 p-2.5 rounded-xl border border-slate-700/80 flex flex-col space-y-1 text-xs cursor-pointer hover:border-slate-600 transition";
                div.onclick = () => {
                    document.getElementById('sourceLang').value = item.sLang;
                    document.getElementById('targetLang').value = item.tLang;
                    handleLangChange();
                    document.getElementById('sourceText').value = item.source;
                    document.getElementById('targetText').textContent = item.target;
                    switchTab('translate');
                };
                div.innerHTML = `
                    <div class="flex items-center justify-between text-[10px] text-slate-400">
                        <span class="font-semibold uppercase tracking-wider">${item.sLang} &rarr; ${item.tLang}</span>
                        <span>${item.time}</span>
                    </div>
                    <div class="text-slate-200 font-medium truncate">${escapeHtml(item.source)}</div>
                    <div class="text-indigo-400 font-medium truncate">${escapeHtml(item.target)}</div>
                `;
                container.appendChild(div);
            });
        }

        function renderFavorites() {
            const container = document.getElementById('favoritesItems');
            const emptyEl = document.getElementById('favoritesEmpty');
            container.innerHTML = '';

            if (appState.favorites.length === 0) {
                emptyEl.style.display = 'block';
                return;
            }
            emptyEl.style.display = 'none';

            appState.favorites.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-slate-800 p-2.5 rounded-xl border border-slate-700/80 flex flex-col space-y-1 text-xs relative";
                div.innerHTML = `
                    <div class="flex items-center justify-between text-[10px] text-slate-400">
                        <span class="font-semibold uppercase tracking-wider">${item.sLang} &rarr; ${item.tLang}</span>
                        <button onclick="removeFavorite(event, ${item.id})" class="text-rose-400 hover:text-rose-300">Supprimer</button>
                    </div>
                    <div class="text-slate-200 font-medium">${escapeHtml(item.source)}</div>
                    <div class="text-indigo-400 font-medium">${escapeHtml(item.target)}</div>
                `;
                container.appendChild(div);
            });
        }

        function removeFavorite(e, id) {
            e.stopPropagation();
            appState.favorites = appState.favorites.filter(f => f.id !== id);
            localStorage.setItem('polyglot_favorites', JSON.stringify(appState.favorites));
            renderFavorites();
            updateFavoriteButtonState();
            showToast("Favori retiré");
        }

        function clearHistory() {
            appState.history = [];
            localStorage.removeItem('polyglot_history');
            renderHistory();
            showToast("Historique vidé");
        }

        function clearFavorites() {
            appState.favorites = [];
            localStorage.removeItem('polyglot_favorites');
            renderFavorites();
            updateFavoriteButtonState();
            showToast("Favoris vidés");
        }

        function switchTab(tab) {
            const isTranslate = tab === 'translate';
            document.getElementById('viewTranslate').style.display = isTranslate ? 'flex' : 'none';
            document.getElementById('viewHistory').style.display = isTranslate ? 'none' : 'flex';

            document.getElementById('tabTranslate').className = isTranslate ? "flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm" : "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-slate-200";
            document.getElementById('tabHistory').className = !isTranslate ? "flex-1 py-2 text-xs font-semibold rounded-lg transition-all bg-indigo-600 text-white shadow-sm" : "flex-1 py-2 text-xs font-semibold rounded-lg transition-all text-slate-400 hover:text-slate-200";
        }

        function switchSubTab(subTab) {
            const isHistory = subTab === 'historyList';
            document.getElementById('historyListContainer').style.display = isHistory ? 'flex' : 'none';
            document.getElementById('favoritesListContainer').style.display = isHistory ? 'none' : 'flex';

            document.getElementById('subTabHistory').className = isHistory ? "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 text-white transition" : "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition";
            document.getElementById('subTabFavorites').className = !isHistory ? "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 text-white transition" : "flex-1 py-1.5 text-xs font-semibold rounded-lg text-slate-400 hover:text-slate-200 transition";
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2200);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
